<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>UFCStats — UFC Fight Night 272</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥊</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:#0a0a0b;color:#f0f0f0;min-height:100vh}
:root{--bg:#0a0a0b;--bg2:#111114;--bg3:#18181c;--bg4:#1e1e24;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--text:#f0f0f0;--text2:#a0a0a8;--text3:#5a5a65;--blue:#3b82f6;--blue-dim:#1d4ed8;--blue-bg:rgba(59,130,246,.12);--red:#ef4444;--red-bg:rgba(239,68,68,.12);--gold:#f59e0b;--green:#22c55e;--green-bg:rgba(34,197,94,.1)}
.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:.75rem 1.25rem;position:sticky;top:0;z-index:100}
.hdr-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.04em}
.logo span{color:var(--red)}
.acc-chip{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:4px 12px;font-size:11px}
.acc-pct{font-weight:700;color:var(--gold)}
.key-btn{font-size:11px;color:var(--blue);cursor:pointer;text-decoration:underline;background:none;border:none;font-family:'Barlow',sans-serif}
.main{max-width:760px;margin:0 auto;padding:1rem 1rem 4rem}
/* NAV DROPDOWN */
.nav-wrap{position:relative;margin-bottom:1.25rem}
.nav-wrap select{width:100%;padding:12px 40px 12px 16px;font-size:14px;font-weight:600;font-family:'Barlow Condensed',sans-serif;letter-spacing:.04em;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:12px;appearance:none;cursor:pointer}
.nav-wrap select:focus{outline:none;border-color:var(--blue)}
.nav-wrap select option{background:#1a1a22;font-weight:400;font-size:13px}
.nav-wrap select optgroup{font-size:11px;color:var(--text3)}
.nav-chevron{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text3);font-size:12px}
/* PANELS */
#cardPanel,#rosterPanel,#customPanel{display:none}
/* FIGHT LIST */
.fight-list{display:flex;flex-direction:column;gap:6px}
.fight-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:border-color .15s,background .15s;user-select:none}
.fight-row:hover{border-color:var(--blue);background:var(--bg4)}
.fight-row:active{background:var(--blue-bg)}
.fr-names{font-size:13px;font-weight:500;color:var(--text)}
.fr-names span{color:var(--text3);font-size:11px;margin:0 4px}
.fr-sub{font-size:10px;color:var(--text3);margin-top:3px}
.fr-pick{text-align:right}
.fr-pct{font-size:12px;font-weight:600;color:var(--blue)}
.fr-pct-label{font-size:9px;color:var(--text3);margin-top:2px}
.section-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:14px 0 7px}
.section-label.prelim{color:var(--text3)}
/* CONTENT AREA */
.content-area{margin-top:1rem}
/* VS BAR */
.vs-bar{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:1rem}
.f-blue{text-align:right}.f-red{text-align:left}
.f-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.03em;line-height:1.2}
.f-nick{font-size:10px;color:var(--text3);margin-top:2px;font-style:italic}
.f-rec{font-size:12px;font-weight:500;margin-top:3px}
.f-form{font-size:10px;color:var(--text3);margin-top:2px;letter-spacing:.08em}
.rank-badge{display:inline-block;font-size:9px;font-weight:600;padding:2px 7px;border-radius:4px;margin-bottom:4px;letter-spacing:.04em}
.rank-blue{background:var(--blue-bg);color:var(--blue)}
.rank-red{background:var(--red-bg);color:var(--red)}
.vs-center{text-align:center}
.vs-pill{background:var(--bg4);border:1px solid var(--border2);border-radius:8px;padding:5px 10px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text2)}
.weight-class{font-size:9px;color:var(--text3);margin-bottom:6px;letter-spacing:.04em}
/* SECTION */
.section{margin-bottom:1rem}
.section-title{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.stat-row{display:grid;grid-template-columns:1fr 110px 1fr;align-items:center;gap:4px;margin-bottom:4px}
.sv-l{text-align:right;font-size:12px;font-weight:500}
.sv-r{text-align:left;font-size:12px;font-weight:500}
.sl{text-align:center;font-size:10px;color:var(--text2);line-height:1.3}
.bar-row{display:grid;grid-template-columns:1fr 110px 1fr;gap:4px;margin-bottom:8px}
.bc{height:4px;border-radius:3px;background:var(--bg4);overflow:hidden}
.bl .bf{height:100%;border-radius:3px;background:var(--blue);float:right}
.br .bf{height:100%;border-radius:3px;background:var(--red)}
.adv-l{color:var(--blue)}.adv-r{color:var(--red)}
/* WIN METHOD */
.wm-box{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:1rem}
.wm-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.wm-label{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.wm-pick{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.04em;padding:3px 12px;border-radius:20px}
.wm-ko{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.wm-sub{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(59,130,246,.2)}
.wm-dec{background:var(--green-bg);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.wm-reason{font-size:12px;color:var(--text2);line-height:1.6}
/* ODDS */
.odds-box{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:1rem}
.odds-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.odds-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.odds-meta{display:flex;align-items:center;gap:8px}
.dk-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px;background:rgba(98,203,93,.12);color:#62cb5d;border:1px solid rgba(98,203,93,.2);letter-spacing:.04em}
.odds-updated{font-size:9px;color:var(--text3)}
.odds-refresh-btn{font-size:10px;padding:3px 9px;border:1px solid var(--border2);background:transparent;color:var(--text2);border-radius:6px;cursor:pointer;font-family:'Barlow',sans-serif}
.odds-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.odds-card{background:var(--bg4);border-radius:10px;padding:10px 12px;text-align:center}
.odds-fighter{font-size:11px;color:var(--text2);margin-bottom:4px}
.odds-line{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1}
.odds-fav{color:var(--red)}.odds-dog{color:var(--gold)}
.odds-implied{font-size:10px;color:var(--text3);margin-top:3px}
.odds-props{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.odds-prop{font-size:10px;padding:3px 8px;border-radius:4px;background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
/* PROB */
.prob-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.prob-card{background:var(--bg4);border-radius:10px;padding:12px;text-align:center}
.prob-pct{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;line-height:1;margin-bottom:3px}
.prob-name{font-size:11px;color:var(--text2)}
.prob-pct-blue{color:var(--blue)}.prob-pct-red{color:var(--red)}
.prob-bar-track{height:6px;border-radius:4px;background:var(--bg4);overflow:hidden;display:flex;margin-bottom:4px}
.pb-blue{background:var(--blue);height:100%}.pb-red{background:var(--red);height:100%}
.prob-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text3)}
/* FINISH */
.finish-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.finish-card{background:var(--bg4);border-radius:10px;padding:10px 12px}
.finish-card h4{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:7px}
.finish-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.finish-type{font-size:11px;color:var(--text2)}.finish-val{font-size:12px;font-weight:500}
.finish-rate-row{margin-top:6px;padding-top:6px;border-top:1px solid var(--border);display:flex;justify-content:space-between}
/* TALENT */
.talent-box{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:1rem}
.talent-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.talent-card{background:var(--bg4);border-radius:10px;padding:10px 12px}
.talent-card h5{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px}
.talent-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.talent-label{font-size:10px;color:var(--text3)}
.talent-stars{display:flex;gap:2px}
.star{width:8px;height:8px;border-radius:1px}
.star-on{background:var(--gold)}.star-off{background:var(--bg3);border:1px solid var(--border2)}
.tier-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.04em;margin-top:5px}
.tier-elite{background:rgba(245,158,11,.15);color:var(--gold);border:1px solid rgba(245,158,11,.25)}
.tier-contender{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(59,130,246,.2)}
.tier-prospect{background:var(--green-bg);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.tier-veteran{background:rgba(160,160,168,.1);color:var(--text2);border:1px solid var(--border2)}
.tier-gatekeeper{background:rgba(160,160,168,.08);color:var(--text3);border:1px solid var(--border)}
/* WINS */
.wins-box{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:1rem}
.wins-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wins-card{background:var(--bg4);border-radius:10px;padding:10px 12px}
.wins-card h5{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px}
.win-entry{display:flex;align-items:flex-start;gap:6px;margin-bottom:5px}
.win-dot{width:5px;height:5px;border-radius:50%;margin-top:5px;flex-shrink:0}
.win-dot-blue{background:var(--blue)}.win-dot-red{background:var(--red)}
.win-name{font-size:11px;color:var(--text);line-height:1.3}
.win-detail{font-size:10px;color:var(--text3)}
.hof-badge,.champ-badge{display:inline-block;font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:middle}
.hof-badge{background:rgba(245,158,11,.2);color:var(--gold);border:1px solid rgba(245,158,11,.3)}
.champ-badge{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(59,130,246,.25)}
.no-wins{font-size:11px;color:var(--text3);font-style:italic}
/* TRACKER */
.tracker-box{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:1rem}
.tracker-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.tracker-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.tracker-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tstat{background:var(--bg4);border-radius:8px;padding:8px 10px;text-align:center}
.tstat-num{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700}
.tstat-label{font-size:9px;color:var(--text3);margin-top:2px}
.model-pick-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg4);border-radius:8px;padding:10px 12px;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.result-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.res-btn{flex:1;min-width:90px;padding:8px 12px;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .15s;border:1px solid var(--border2);background:transparent;color:var(--text2)}
.res-btn-correct{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.res-btn-wrong{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.tracker-log{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.log-title{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:7px}
.log-entry{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px}
.log-entry:last-child{border-bottom:none}
.log-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.log-dot-correct{background:var(--green)}.log-dot-wrong{background:var(--red)}
.log-fight{flex:1;color:var(--text2);line-height:1.3}
.log-pick{font-size:10px;color:var(--text3)}
.log-pct{font-size:10px;font-weight:600;white-space:nowrap}
.log-pct-correct{color:var(--green)}.log-pct-wrong{color:var(--red)}
.clear-log-btn{font-size:10px;padding:2px 8px;border:1px solid var(--border2);background:transparent;color:var(--text3);border-radius:6px;cursor:pointer}
/* ROUND TRACKER */
.rounds-box{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:1rem}
.rounds-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rounds-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.rounds-clear{font-size:10px;padding:3px 9px;border:1px solid var(--border2);background:transparent;color:var(--text3);border-radius:6px;cursor:pointer}
.round-row{display:grid;grid-template-columns:40px 1fr auto 1fr 40px;align-items:center;gap:6px;padding:7px 10px;background:var(--bg4);border-radius:8px;margin-bottom:4px}
.rnd-label{font-size:11px;font-weight:600;color:var(--text3);text-align:center}
.rnd-input{width:50px;padding:4px 6px;font-size:12px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:6px;text-align:center;font-family:'Barlow',sans-serif}
.rnd-input:focus{outline:none;border-color:var(--blue)}
.rnd-winner-btns{display:flex;gap:4px;justify-content:center}
.rnd-btn{font-size:10px;padding:3px 8px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:'Barlow',sans-serif;transition:all .12s}
.rnd-btn.picked-blue{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
.rnd-btn.picked-red{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.scorecard{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);align-items:center;flex-wrap:wrap}
.score-chip{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;padding:4px 14px;border-radius:8px}
.score-blue{background:var(--blue-bg);color:var(--blue)}
.score-red{background:var(--red-bg);color:var(--red)}
.score-label{font-size:10px;color:var(--text3)}
/* ANALYSIS */
.analysis-box{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:1rem}
.analysis-edge{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.03em;margin-bottom:8px}
.analysis-p{font-size:12px;color:var(--text2);line-height:1.65;margin-bottom:5px}
.deep-btn{margin-top:10px;padding:8px 18px;font-size:12px;font-weight:600;border-radius:8px;border:1px solid var(--blue);background:var(--blue-bg);color:var(--blue);cursor:pointer;font-family:'Barlow',sans-serif;display:inline-flex;align-items:center;gap:6px}
.deep-btn:hover{background:var(--blue);color:#fff}
.deep-btn:disabled{opacity:.5;cursor:not-allowed}
.ai-content{font-size:13px;color:var(--text2);line-height:1.75;margin-top:12px}
.ai-content strong{color:var(--text);font-weight:600}
.ai-thinking{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3);margin-top:10px}
/* ROSTER */
.roster-controls{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.rsearch-wrap{flex:1;min-width:160px;position:relative}
.rsearch-wrap input{width:100%;padding:9px 12px 9px 32px;font-size:13px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:10px;font-family:'Barlow',sans-serif}
.rsearch-wrap input:focus{outline:none;border-color:var(--blue)}
.rsearch-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
.div-filter{padding:9px 12px;font-size:12px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:10px;font-family:'Barlow',sans-serif;cursor:pointer}
.roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:7px;margin-bottom:1rem;max-height:400px;overflow-y:auto}
.fighter-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 11px;cursor:pointer;transition:all .15s;user-select:none}
.fighter-card:hover{border-color:var(--border2);background:var(--bg4)}
.fighter-card.sel-blue{border-color:var(--blue);background:var(--blue-bg)}
.fighter-card.sel-red{border-color:var(--red);background:var(--red-bg)}
.fc-name{font-size:12px;font-weight:500;line-height:1.3;margin-bottom:3px}
.fc-rec{font-size:10px;color:var(--text3);margin-bottom:2px}
.fc-div{font-size:9px;color:var(--text3)}
.fc-champ{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;background:rgba(245,158,11,.2);color:var(--gold);border:1px solid rgba(245,158,11,.3);margin-left:3px}
.roster-sel-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:1rem}
.sel-empty{font-size:12px;color:var(--text3);font-style:italic}
.roster-compare-btn{width:100%;padding:11px;font-size:14px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:.06em;background:var(--blue);color:#fff;border:none;border-radius:10px;cursor:pointer;margin-bottom:1rem}
.roster-compare-btn:disabled{opacity:.4;cursor:not-allowed}
/* CUSTOM */
.custom-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.custom-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px}
.custom-card h4{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.04em;margin-bottom:12px}
.input-row{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.input-row label{font-size:10px;color:var(--text3)}
.input-row input{padding:6px 9px;font-size:12px;background:var(--bg4);color:var(--text);border:1px solid var(--border);border-radius:7px;font-family:'Barlow',sans-serif}
.input-row input:focus{outline:none;border-color:var(--blue)}
.compare-btn{width:100%;padding:11px;font-size:14px;font-weight:600;font-family:'Barlow Condensed',sans-serif;letter-spacing:.05em;background:var(--blue);color:#fff;border:none;border-radius:10px;cursor:pointer}
/* VENUE BANNER */
.venue-banner{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.venue-item{font-size:11px;color:var(--text3)}
.venue-item strong{color:var(--text2);font-weight:500}
/* KEY MODAL */
#keyModal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem}
@media(max-width:520px){
  .custom-grid{grid-template-columns:1fr}

<header class="hdr">
  <div class="hdr-inner">

      <div class="logo">UFC<span>Stats</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="acc-chip" id="accChip" title="Model accuracy">Accuracy <span class="acc-pct" id="accPct">—</span></div>
      <button class="key-btn" onclick="promptKey()">⚙ API Key</button>
    </div>
  </div>
</header>

<main class="main">

  <!-- MASTER DROPDOWN -->

      <optgroup label="── LIVE CARD ──">
        <option value="live">🥊 UFC Fight Night 272 — Apr 5, Las Vegas</option>
      </optgroup>
      <optgroup label="── FN 272 · MAIN CARD · 8 PM ET ──">
        <option value="fight_0">🏆 Moicano vs. Duncan — Lightweight · 5 rds</option>
        <option value="fight_1">Jandiroba vs. Ricci — W. Strawweight</option>
        <option value="fight_2">Ewing vs. Estevam — Bantamweight</option>
      </optgroup>
      <optgroup label="── FN 272 · PRELIM CARD · 5 PM ET ──">
        <option value="fight_3">Pat vs. Petersen — Heavyweight</option>
        <option value="fight_4">Delano vs. Ruchala — Featherweight</option>
        <option value="fight_5">Costa vs. Nicoll — Flyweight</option>
        <option value="fight_6">Pereira vs. Cowan — W. Bantamweight</option>
        <option value="fight_7">Barbosa vs. Gatto — W. Flyweight</option>
      </optgroup>
      <optgroup label="── ROSTER ──">
        <option value="roster">👥 Roster Matchup — Pick Any Two</option>
      </optgroup>
      <optgroup label="── CUSTOM ──">
        <option value="custom">⚙ Custom Fighter Builder</option>
      </optgroup>
    </select>
    <div class="nav-chevron">▼</div>
  </div>

  <!-- LIVE PANEL -->
  <div id="livePanel">
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:1rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
        <div>
          <div id="liveEventHeader" style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--text);letter-spacing:.03em">UFC Fight Night 272 · Moicano vs. Duncan</div>
          <div id="liveEventSub" style="font-size:10px;color:var(--text3);margin-top:2px">Sat, Apr 5, 2026 · Meta APEX · Las Vegas, NV</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span id="liveRefreshBadge" style="font-size:10px;color:var(--text3)">Loading…</span>
          <button onclick="fetchAndBuildLive()" style="font-size:11px;padding:4px 10px;border:1px solid var(--border2);background:transparent;color:var(--text2);border-radius:6px;cursor:pointer;font-family:'Barlow',sans-serif">↻ Refresh</button>
        </div>
      </div>
      <div style="font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:7px">MAIN CARD</div>
      <div class="fight-list" id="mainList"></div>
      <div style="font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:12px 0 7px">PRELIMINARY CARD</div>
      <div class="fight-list" id="prelimList"></div>
    </div>
    <div id="liveVenueBanner"></div>
    <div id="liveContent"></div>
  </div>

  <!-- CARD PANEL (direct fight from dropdown) -->
  <div id="cardPanel">
    <div class="venue-banner" id="venueBanner"></div>
    <div id="fightDisplay"></div>
  </div>

  <!-- ROSTER PANEL -->
  <div id="rosterPanel">

    <div class="roster-controls">
      <div class="rsearch-wrap">
        <span class="rsearch-icon">⌕</span>

        <option value="Heavyweight">Heavyweight</option>
        <option value="Light Heavyweight">Light Heavyweight</option>
        <option value="Middleweight">Middleweight</option>
        <option value="Welterweight">Welterweight</option>

    <div id="rosterGrid" class="roster-grid"></div>
    <div id="rosterResult"></div>
  </div>

  <div id="customPanel">
    <div class="custom-grid">
      <div class="custom-card">
        <h4 style="color:var(--blue)">🔵 Blue Corner</h4>
        <div class="input-row"><label>Name</label><input id="ca-name" value="Fighter A"/></div>
        <div class="input-row"><label>Record</label><input id="ca-rec" value="20-3"/></div>
        <div class="input-row"><label>Age</label><input id="ca-age" type="number" value="28"/></div>

        <div class="input-row"><label>Str. Acc %</label><input id="ca-sacc" type="number" value="48"/></div>

    </div>

  </div>

</main>

// ── TRACKER ────────────────────────────────────────
function loadTracker(){try{return JSON.parse(localStorage.getItem('ufcProbTracker')||'{"correct":0,"total":0,"log":[]}')}catch(e){return{correct:0,total:0,log:[]};}}
function saveTracker(t){try{localStorage.setItem('ufcProbTracker',JSON.stringify(t));}catch(e){}}
function updateAccChip(){
  var t=loadTracker();
  var pct=t.total>0?Math.round(t.correct/t.total*100)+'%':'—';
  document.getElementById('accPct').textContent=pct;
}
function logModelResult(correct,label,modelPick,modelPct,actualWinner){
  var t=loadTracker();
  t.total++; if(correct)t.correct++;
  t.log.unshift({correct:correct,label:label,modelPick:modelPick,modelPct:modelPct,actualWinner:actualWinner,date:new Date().toLocaleDateString()});
  if(t.log.length>100)t.log=t.log.slice(0,100);
  saveTracker(t); updateAccChip();
}
function renderTrackerLog(){
  var t=loadTracker();
  if(!t.log.length)return '<div style="font-size:11px;color:var(--text3);font-style:italic;padding:4px 0">No results logged yet</div>';
  return t.log.slice(0,8).map(function(e){
    return '<div class="log-entry">'
      +'<div class="log-dot '+(e.correct?'log-dot-correct':'log-dot-wrong')+'"></div>'
      +'<div class="log-fight"><div>'+e.label+'</div>'
      +'<div class="log-pick">Picked: <strong>'+e.modelPick+'</strong> · Won: <strong>'+e.actualWinner+'</strong></div></div>'
      +'<div class="log-pct '+(e.correct?'log-pct-correct':'log-pct-wrong')+'">'+e.modelPct+'%</div>'
      +'</div>';
  }).join('');
}

// ── ROUND TRACKER ──────────────────────────────────
var roundData={};
function getRoundKey(fi){return 'fight_'+fi;}
function initRounds(fi,n){var k=getRoundKey(fi);if(!roundData[k])roundData[k]=[];while(roundData[k].length<n)roundData[k].push({aStrikes:'',bStrikes:'',winner:null});}

// ── CALC PROB ──────────────────────────────────────
function calcProb(a,b){
  var sA=0,sB=0;
  sA+=a.sacc*.20;sB+=b.sacc*.20;
  sA+=a.sdef*.12;sB+=b.sdef*.12;
  sA+=a.tdacc*.08;sB+=b.tdacc*.08;
  sA+=a.tddef*.08;sB+=b.tddef*.08;
  var finA=(a.ko+a.sub)/(a.ko+a.sub+a.dec+1)*100;
  var finB=(b.ko+b.sub)/(b.ko+b.sub+b.dec+1)*100;
  sA+=finA*.15;sB+=finB*.15;
  sA+=Math.max(0,35-a.age)*.4;sB+=Math.max(0,35-b.age)*.4;
  sA+=(a.reach||70)*.05;sB+=(b.reach||70)*.05;
  var fm={W:2,L:-2,D:0};
  (a.form||'').split(' ').forEach(function(r){sA+=(fm[r]||0);});
  (b.form||'').split(' ').forEach(function(r){sB+=(fm[r]||0);});
  var tot=sA+sB;
  var pA=Math.round((sA/tot)*100);
  return[pA,100-pA];
}

function implied(l){if(!l)return'—';var n=parseInt(l);return n<0?Math.round(Math.abs(n)/(Math.abs(n)+100)*100)+'%':Math.round(100/(n+100)*100)+'%';}

// ── RENDER COMPARISON ──────────────────────────────
function renderComp(a,b,wm,label,odds,fightIdx){
  var prob=calcProb(a,b);
  var fIdx=fightIdx!=null?fightIdx:'c';
  var numRounds=(fIdx==='c')?3:(fIdx<2?5:3);
  if(fIdx!=='c')initRounds(fIdx,numRounds);

  var wCol=prob[0]>=prob[1]?'var(--blue)':'var(--red)';
  var wName=prob[0]>=prob[1]?a.name.split(' ')[0]:b.name.split(' ')[0];

// ── BIND LISTENERS after innerHTML set ─────────────
function bindListeners(fIdx,a,b,wm,prob){
  var mW=prob[0]>=prob[1]?a:b, mL=prob[0]>=prob[1]?b:a, mPct=Math.max(prob[0],prob[1]);

  // odds refresh
  var ob=document.getElementById('oddsRefBtn_'+fIdx);
  if(ob)ob.addEventListener('click',function(){
    var t=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    var el=document.getElementById('oddsUp_'+fIdx); if(el)el.textContent='Updated '+t;
  });

  // round tracker
  if(fIdx!=='c'){
    var nRds=fIdx<2?5:3;
    for(var i=0;i<nRds;i++){
      (function(ri){
        var inA=document.getElementById('rA_'+fIdx+'_'+ri);
        var inB=document.getElementById('rB_'+fIdx+'_'+ri);
        var btA=document.getElementById('rbA_'+fIdx+'_'+ri);
        var btB=document.getElementById('rbB_'+fIdx+'_'+ri);
        if(inA)inA.addEventListener('change',function(){updateRound(fIdx,ri,'aStrikes',this.value);});
        if(inB)inB.addEventListener('change',function(){updateRound(fIdx,ri,'bStrikes',this.value);});
        if(btA)btA.addEventListener('click',function(){setRoundWinner(fIdx,ri,'a',a,b);});
        if(btB)btB.addEventListener('click',function(){setRoundWinner(fIdx,ri,'b',a,b);});
      })(i);
    }

    // clear rounds
    var cr=document.getElementById('clearRndBtn_'+fIdx);
    if(cr)cr.addEventListener('click',function(){clearRounds(fIdx);});

    // tracker result buttons
    var rc=document.getElementById('resC_'+fIdx);
    var rw=document.getElementById('resW_'+fIdx);
    if(rc)rc.addEventListener('click',function(){recordResult(fIdx,mW,mL,mPct,true,a,b,wm);});
    if(rw)rw.addEventListener('click',function(){recordResult(fIdx,mW,mL,mPct,false,a,b,wm);});

    // clear log
    var cl=document.getElementById('clrLog_'+fIdx);
    if(cl)cl.addEventListener('click',function(){
      if(!confirm('Clear history?'))return;
      localStorage.removeItem('ufcProbTracker');
      updateAccChip();
      var ld=document.getElementById('trkLog_'+fIdx); if(ld)ld.innerHTML=renderTrackerLog();
    });
  }

  // deep AI
  var db=document.getElementById('deepBtn_'+fIdx);
  if(db)db.addEventListener('click',function(){
    runDeepAnalysis(db,a,b,prob,wm);
  });

  // refresh stats
  var rb=document.getElementById('refreshBtn_'+fIdx);
  if(rb)rb.addEventListener('click',function(){
    refreshStats(rb,fIdx,a,b);
  });
}

// ── ROUND TRACKER ACTIONS ──────────────────────────
function updateRound(fi,ri,key,val){var k=getRoundKey(fi);if(roundData[k])roundData[k][ri][key]=val;updateScorecard(fi);}
function setRoundWinner(fi,ri,who,a,b){
  var k=getRoundKey(fi); if(!roundData[k])return;
  roundData[k][ri].winner=roundData[k][ri].winner===who?null:who;
  var aF=a.name.split(' ')[0],bF=b.name.split(' ')[0];
  var nRds=fi<2?5:3;
  for(var i=0;i<nRds;i++){
    var rd=roundData[k][i];
    var btA=document.getElementById('rbA_'+fi+'_'+i);
    var btB=document.getElementById('rbB_'+fi+'_'+i);
    if(btA){btA.className='rnd-btn'+(rd.winner==='a'?' picked-blue':'');}
    if(btB){btB.className='rnd-btn'+(rd.winner==='b'?' picked-red':'');}
  }
  updateScorecard(fi,a,b);
}
function updateScorecard(fi,a,b){
  var k=getRoundKey(fi); var sc=document.getElementById('scorecard_'+fi);
  if(!sc||!roundData[k])return;
  var aR=0,bR=0,aS=0,bS=0;
  roundData[k].forEach(function(rd){if(rd.winner==='a')aR++;else if(rd.winner==='b')bR++;aS+=parseInt(rd.aStrikes)||0;bS+=parseInt(rd.bStrikes)||0;});
  if(!aR&&!bR&&!aS&&!bS){sc.innerHTML='';return;}
  var fight=FIGHTS[fi]; var aN=fight?fight.a.name.split(' ')[0]:'A',bN=fight?fight.b.name.split(' ')[0]:'B';
  sc.innerHTML='<span class="score-label">Rounds:</span><span class="score-chip score-blue">'+aN+' '+aR+'</span><span class="score-chip score-red">'+bN+' '+bR+'</span>'
    +'<span class="score-label" style="margin-left:8px">Str:</span><span class="score-chip score-blue">'+aS+'</span><span class="score-chip score-red">'+bS+'</span>'
    +(aR>bR?'<span style="font-size:11px;color:var(--blue);font-weight:600">'+aN+' leading</span>':aR<bR?'<span style="font-size:11px;color:var(--red);font-weight:600">'+bN+' leading</span>':'<span style="font-size:11px;color:var(--text3)">Even</span>');
}
function clearRounds(fi){var k=getRoundKey(fi);roundData[k]=[];initRounds(fi,fi<2?5:3);loadFight(fi);}

// ── TRACKER RECORD ──────────────────────────────────
function recordResult(fi,mW,mL,mPct,correct,a,b,wm){
  var fight=FIGHTS[fi]; var label=fight?fight.label.split('·')[0].trim():'Fight';
  var actual=correct?mW.name.split(' ').slice(-1)[0]:mL.name.split(' ').slice(-1)[0];
  logModelResult(correct,label,mW.name.split(' ').slice(-1)[0],mPct,actual);
  var el=document.getElementById('predResult_'+fi);
  if(el){
    var col=correct?'var(--green)':'var(--red)';
    el.innerHTML='<div style="font-size:12px;color:'+col+';font-weight:500;padding:8px 0">'+(correct?'✓ Correct — ':'✗ Wrong — ')+actual+' won</div>'
      +'<div style="font-size:10px;color:var(--text3)">Logged to tracker</div>';
  }
  var ld=document.getElementById('trkLog_'+fi); if(ld)ld.innerHTML=renderTrackerLog();
  updateAccChip();
}

// ── ESPN ATHLETE STATS FETCH ──────────────────────────
// Fetches real-time stats from sports.core.api.espn.com for both fighters
// and merges them into our local fighter objects before rendering

async function fetchAthleteStats(athleteId) {
  try {
    var r = await fetch('/api/espn?type=athlete_stats&id=' + athleteId + '&_=' + Date.now());
    if (!r.ok) return null;
    var d = await r.json();
    return d;
  } catch(e) {
    return null;
  }
}

async function fetchAthleteProfile(athleteId) {
  try {
    var r = await fetch('/api/espn?type=athlete&id=' + athleteId + '&_=' + Date.now());
    if (!r.ok) return null;
    var d = await r.json();
    return d;
  } catch(e) {
    return null;
  }
}

// Parse ESPN statistics response into our fighter stat format
function parseESPNStats(statsData, profileData) {
  var updated = {};
  
  // From profile: record, age, height, reach
  if (profileData) {
    if (profileData.displayName) updated.name = profileData.displayName;
    if (profileData.age) updated.age = profileData.age;
    if (profileData.displayHeight) updated.height = profileData.displayHeight;
    
    // Record from profile
    if (profileData.record) {
      var wins = profileData.record.items && profileData.record.items.find(function(r){ return r.type === 'wins'; });
      var losses = profileData.record.items && profileData.record.items.find(function(r){ return r.type === 'losses'; });
      if (wins && losses) updated.rec = wins.displayValue + '-' + losses.displayValue;
    }
    
    // Stats from athlete.statistics
    if (profileData.statistics && profileData.statistics.splits) {
      var splits = profileData.statistics.splits;
      parseStatSplits(splits, updated);
    }
  }
  
  // From separate stats endpoint
  if (statsData && statsData.splits) {
    parseStatSplits(statsData.splits, updated);
  }
  
  return updated;
}

function parseStatSplits(splits, out) {
  if (!splits || !splits.categories) return;
  splits.categories.forEach(function(cat) {
    if (!cat.stats) return;
    cat.stats.forEach(function(s) {
      var name = (s.name || s.abbreviation || '').toLowerCase();
      var val  = parseFloat(s.displayValue || s.value) || 0;
      // Map ESPN stat names to our field names
      if (name === 'slpm' || name === 'sigstrikespm' || name.includes('sig.str.land')) out.slpm = val;
      if (name === 'stracc' || name === 'sigstrikesacc' || name.includes('str.acc')) out.sacc = val > 1 ? val : Math.round(val * 100);
      if (name === 'strdef' || name === 'sigstrikesdef' || name.includes('str.def')) out.sdef = val > 1 ? val : Math.round(val * 100);
      if (name === 'tdavg' || name.includes('td avg') || name.includes('takedown avg')) out.tdavg = val;
      if (name === 'tdacc' || name.includes('td acc')) out.tdacc = val > 1 ? val : Math.round(val * 100);
      if (name === 'tddef' || name.includes('td def')) out.tddef = val > 1 ? val : Math.round(val * 100);
      if (name === 'subavg' || name.includes('sub.avg') || name.includes('submission avg')) out.subavg = val;
    });
  });
}

// Main function: fetch ESPN stats for both fighters, merge, render, then load round stats

      + '<span class="venue-item"><strong>Venue:</strong> ' + VENUE.name + ', ' + VENUE.city + '</span>'
      + '<span class="venue-item"><strong>Altitude:</strong> ' + VENUE.altitude + 'ft — Sea level</span>'
      + '<span class="venue-item"><strong>Octagon:</strong> ' + VENUE.octagon + '</span>'
      + '<span class="venue-item"><strong>Temp:</strong> ~' + VENUE.tempF + '°F · Indoor</span>'
      + (aProfile || bProfile
          ? '<span class="venue-item" style="color:var(--green)">✓ Live stats from ESPN</span>'
          : '<span class="venue-item" style="color:var(--text3)">Static stats (ESPN unavailable)</span>')
      + '</div>';
  }

  // Render fight comparison (guard against renderComp errors)
  try {
    var html = renderComp(a, b, f.wm, f.label, f.odds, i);
    if (!html) throw new Error('renderComp returned empty');
    container.innerHTML = html;
  } catch(e) {

    try {
      container.innerHTML = renderComp(f.a, f.b, f.wm, f.label, f.odds, i);

    }
  }

  try { bindListeners(i, a, b, f.wm, calcProb(a, b)); } catch(e) {}

  // Scroll to show the rendered card below the sticky header
  scrollToContent(container);

  // Append live round stats section when ESPN competition IDs are present

    var rsDiv = document.createElement('div');

    container.appendChild(rsDiv);

// ── REFRESH STATS ──────────────────────────────────
// Called by the "↻ Refresh Stats" button in the fight display.
// Looks up athlete IDs from the cached ESPN scoreboard and re-fetches.
async function refreshStats(btn, fIdx, a, b) {
  var aEspnId = (a && a.espnAthleteId) || null;
  var bEspnId = (b && b.espnAthleteId) || null;

  // Try to resolve IDs from ESPN scoreboard cache when not pre-set
  if (!aEspnId && _liveESPNData) {
    var comps = (_liveESPNData.events && _liveESPNData.events[0] && _liveESPNData.events[0].competitions) || [];
    var aLow = a.name.split(' ').slice(-1)[0].toLowerCase();
    var bLow = b.name.split(' ').slice(-1)[0].toLowerCase();
    comps.some(function(comp){
      var cs = comp.competitors || [];
      var cA = cs.find(function(x){return x.order===1;})||cs[0];
      var cB = cs.find(function(x){return x.order===2;})||cs[1];
      if (!cA || !cB) return false;
      var nA = ((cA.athlete&&cA.athlete.displayName)||'').split(' ').slice(-1)[0].toLowerCase();
      var nB = ((cB.athlete&&cB.athlete.displayName)||'').split(' ').slice(-1)[0].toLowerCase();
      var match = (nA===aLow&&nB===bLow)||(nA===bLow&&nB===aLow);
      if (match) {
        var flipped = nA !== aLow;
        aEspnId = flipped ? (cB.athlete&&cB.athlete.id)||null : (cA.athlete&&cA.athlete.id)||null;
        bEspnId = flipped ? (cA.athlete&&cA.athlete.id)||null : (cB.athlete&&cB.athlete.id)||null;
      }
      return match;
    });
  }

  // Determine which container is currently showing this fight
  var lc = document.getElementById('liveContent');
  var tid = (lc && lc.innerHTML.trim()) ? 'liveContent' : 'fightDisplay';

  // Look up ESPN competition IDs for round stats
  var comp = lookupEspnComp(a.name, b.name);
  await loadFightWithLiveStats(fIdx, tid, aEspnId, bEspnId, comp ? comp.eid : null, comp ? comp.cid : null);
}

// Scroll element into view below the sticky header, after a paint frame.

// ── NAME MATCHING ──────────────────────────────────
// Robust name match: handles accents, compound last names (e.g. "de Oliveira" vs "Moicano")
function nmatch(a, b) {
  function norm(s) {
    var low = (s || '').toLowerCase();
    try { low = low.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch(e) {}
    return low.replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim();
  }
  var na = norm(a), nb = norm(b);
  if (!na || !nb) return false;
  // Last word exact match (handles most cases)
  if (na.split(' ').pop() === nb.split(' ').pop()) return true;
  // Any significant word (>3 chars) shared between names
  var wa = na.split(' ').filter(function(w){return w.length > 3;});
  var wb = nb.split(' ').filter(function(w){return w.length > 3;});
  return wa.some(function(w){return wb.indexOf(w) >= 0;});
}

// ── ESPN COMPETITION LOOKUP ────────────────────────
// Find eid/cid/athleteIds from the cached ESPN scoreboard by fighter name
function lookupEspnComp(aName, bName) {
  try {
    if (!_liveESPNData || !_liveESPNData.events || !_liveESPNData.events[0]) return null;
    var eid = _liveESPNData.events[0].id;
    var comps = _liveESPNData.events[0].competitions || [];
    for (var ci = 0; ci < comps.length; ci++) {
      var comp = comps[ci];
      var cs = comp.competitors || [];
      var cA = cs.find(function(x){return x.order===1;})||cs[0];
      var cB = cs.find(function(x){return x.order===2;})||cs[1];
      if (!cA || !cB) continue;
      var nA = (cA.athlete&&cA.athlete.displayName)||'';
      var nB = (cB.athlete&&cB.athlete.displayName)||'';
      var fwd = nmatch(aName, nA) && nmatch(bName, nB);
      var rev = nmatch(aName, nB) && nmatch(bName, nA);
      if (fwd || rev) {
        var flip = rev && !fwd;
        return {
          eid: eid, cid: comp.id,
          aAthleteId: flip ? (cB.athlete&&cB.athlete.id)||null : (cA.athlete&&cA.athlete.id)||null,
          bAthleteId: flip ? (cA.athlete&&cA.athlete.id)||null : (cB.athlete&&cB.athlete.id)||null
        };
      }
    }
    return null;
  } catch(e) { return null; }
}

// Returns true if the given competition ID is currently in-progress
function isCompLive(cid) {
  if (!_liveESPNData || !_liveESPNData.events || !_liveESPNData.events[0]) return false;
  var comps = _liveESPNData.events[0].competitions || [];
  var comp = comps.find(function(c){return c.id === cid;});
  return !!(comp && comp.status && comp.status.type && comp.status.type.state === 'in');
}

// ── ROUND STATS ────────────────────────────────────
async function showRoundStats(eid, cid, a, b, fightIdx, container) {
  container.innerHTML = '<div style="padding:10px 0 4px;text-align:center;color:var(--text3);font-size:11px">Loading round stats from ESPN…</div>';
  try {
    var r = await fetch('/api/espn?type=competition_stats&eid='+eid+'&cid='+cid+'&_='+Date.now());
    if (!r.ok) throw new Error('ESPN '+r.status);
    var data = await r.json();
    if (data.error) throw new Error(data.error);
    container.innerHTML = buildRoundStatsHtml(data, a, b, fightIdx, eid, cid);
    bindRoundStatsListeners(fightIdx, data, a, b, eid, cid);
    // Auto-populate Live Round Tracker with ESPN data
    if (fightIdx >= 0) {
      applyEspnToRoundTracker(fightIdx, parseCompStats(data), a, b);
    }
    // Set up 30s live polling when fight is active
    if (_roundStatsTimer) { clearInterval(_roundStatsTimer); _roundStatsTimer = null; }
    if (eid && cid && isCompLive(cid)) {
      _roundStatsTimer = setInterval(async function(){
        try {
          var lr = await fetch('/api/espn?type=competition_stats&eid='+eid+'&cid='+cid+'&_='+Date.now());
          if (!lr.ok) return;
          var ld = await lr.json();
          if (ld.error) return;
          if (fightIdx >= 0) applyEspnToRoundTracker(fightIdx, parseCompStats(ld), a, b);
          var sec = document.getElementById('roundStatsSection_'+fightIdx);
          if (sec) {
            sec.innerHTML = buildRoundStatsHtml(ld, a, b, fightIdx, eid, cid);
            bindRoundStatsListeners(fightIdx, ld, a, b, eid, cid);
          }
          if (!isCompLive(cid)) { clearInterval(_roundStatsTimer); _roundStatsTimer = null; }
        } catch(e){}
      }, 30000);
    }
  } catch(e) {
    container.innerHTML = ''; // Silently hide — fight detail still works without it
  }
}

// Parse ESPN competition_stats into perRound[roundNum][fighterName] = {sig, sigAtt, td, ctrl, kd}
function parseCompStats(data) {
  var perRound = {}, athNames = [];
  try {
    var cats = (data.splits && data.splits.categories) || [];
    cats.forEach(function(cat){
      (cat.athletes||[]).forEach(function(ath){
        var name = (ath.athlete&&ath.athlete.displayName)||'';
        if (name && athNames.indexOf(name)<0) athNames.push(name);
        var splitCats = (ath.splits&&ath.splits.categories)||[];
        splitCats.forEach(function(sc){
          var sn = (sc.name||sc.displayName||'').toLowerCase().trim();
          var rm = sn.match(/^(\d+)$/) || sn.match(/round\s*(\d)/);
          if (!rm) return;
          var rn = rm[1];
          if (!perRound[rn]) perRound[rn] = {};
          if (!perRound[rn][name]) perRound[rn][name] = {};
          var rd = perRound[rn][name];
          (sc.stats||[]).forEach(function(s){
            var key = (s.name||s.abbreviation||'').toLowerCase();
            var val = s.displayValue || String(Math.round(s.value||0));
            if (key.includes('sigstrikesland') || key==='sigstrikes') rd.sig = val;
            else if (key.includes('sigstrikesatt')) rd.sigAtt = val;
            else if (key.includes('totalstrikes') && !key.includes('att')) rd.total = val;
            else if ((key.includes('takedown') && !key.includes('att') && !key.includes('def')) || key==='tds') rd.td = val;
            else if (key.includes('control') || key==='ctrl') rd.ctrl = val;
            else if (key.includes('knockdown') || key==='kd') rd.kd = val;
          });
        });
      });
    });
  } catch(e){}
  return { perRound: perRound, athNames: athNames };
}

function buildRoundStatsHtml(data, a, b, fightIdx, eid, cid) {

    h += '<div></div><div style="color:var(--blue)">'+aLast+'</div><div style="color:var(--red)">'+bLast+'</div></div>';
    rounds.forEach(function(rn){
      var rd = parsed.perRound[rn]||{};

            || Object.keys(rd).find(function(k){return k.toLowerCase().includes(last.toLowerCase());});

        var t='';

        if(s.kd&&s.kd!=='0') t+=(t?', ':'')+s.kd+' KD';

  h += '</div><div id="roundPredPanel_'+fightIdx+'"></div></div>';

function bindRoundStatsListeners(fightIdx, data, a, b, eid, cid) {

// Auto-populate the Live Round Tracker with ESPN per-round sig-strike data
function applyEspnToRoundTracker(fightIdx, parsed, a, b) {
  if (fightIdx < 0 || !parsed || !parsed.perRound) return;
  var k = getRoundKey(fightIdx);
  var nRds = fightIdx < 2 ? 5 : 3;
  initRounds(fightIdx, nRds);
  var aLast = a.name.split(' ').slice(-1)[0];
  var bLast = b.name.split(' ').slice(-1)[0];
  var rounds = Object.keys(parsed.perRound).map(Number).sort(function(x,y){return x-y;});
  var changed = false;
  rounds.forEach(function(rn) {
    var ri = rn - 1;
    if (ri < 0 || ri >= nRds) return;
    var rd = parsed.perRound[rn] || {};
    function findKey(last) {
      return Object.keys(rd).find(function(kk){return nmatch(kk, last);}) || null;
    }
    var aKey = findKey(aLast);
    var bKey = findKey(bLast);
    var as = aKey ? rd[aKey] : {};
    var bs = bKey ? rd[bKey] : {};
    var aSig = parseInt(as.sig) || 0;
    var bSig = parseInt(bs.sig) || 0;
    var aTd = parseInt(as.td) || 0;
    var bTd = parseInt(bs.td) || 0;
    var aKd = parseInt(as.kd) || 0;
    var bKd = parseInt(bs.kd) || 0;
    // Score: sig strikes + 2pts per TD + 5pts per KD
    var score = (aSig + aTd*2 + aKd*5) - (bSig + bTd*2 + bKd*5);
    roundData[k][ri].aStrikes = aSig;
    roundData[k][ri].bStrikes = bSig;
    if (score !== 0) roundData[k][ri].winner = score > 0 ? 'a' : 'b';
    changed = true;
    // Update strike inputs in DOM
    var inA = document.getElementById('rA_'+fightIdx+'_'+ri);
    var inB = document.getElementById('rB_'+fightIdx+'_'+ri);
    if (inA) inA.value = aSig;
    if (inB) inB.value = bSig;
  });
  if (!changed) return;
  // Update winner buttons for all rounds
  for (var i = 0; i < nRds; i++) {
    var rdi = roundData[k][i];
    var btA = document.getElementById('rbA_'+fightIdx+'_'+i);
    var btB = document.getElementById('rbB_'+fightIdx+'_'+i);
    if (btA) btA.className = 'rnd-btn' + (rdi.winner==='a' ? ' picked-blue' : '');
    if (btB) btB.className = 'rnd-btn' + (rdi.winner==='b' ? ' picked-red' : '');
  }
  updateScorecard(fightIdx, a, b);
  // Add ESPN LIVE badge to the rounds-title span
  var rowsEl = document.getElementById('roundRows_'+fightIdx);
  if (rowsEl) {
    var titleEl = rowsEl.parentNode && rowsEl.parentNode.querySelector('.rounds-title');
    if (titleEl && !titleEl.querySelector('.espn-live-badge')) {
      titleEl.insertAdjacentHTML('beforeend', '<span class="espn-live-badge" style="font-size:8px;padding:1px 5px;border-radius:3px;background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);margin-left:6px;font-weight:700;letter-spacing:.05em">ESPN LIVE</span>');
    }
  }
}

// Predict round winners: ESPN stats + X.com search → Claude streaming analysis
async function predictRoundWinner(a, b, statsData, fightIdx) {
  var panel = document.getElementById('roundPredPanel_'+fightIdx);
  var btn   = document.getElementById('roundPredBtn_'+fightIdx);
  if (!panel) return;
  if (btn) { btn.disabled=true; btn.textContent='🔮 Analyzing rounds…'; }
  panel.innerHTML = '<div class="ai-thinking" style="padding:8px 0">Searching X.com and building analysis <span>…</span></div>';

  // Fetch X.com commentary via search proxy
  var xSnippets = [];
  try {
    var xq = a.name.split(' ').slice(-1)[0]+' '+b.name.split(' ').slice(-1)[0]+' UFC round';
    var xr = await fetch('/api/xsearch?q='+encodeURIComponent(xq)+'&_='+Date.now());
    if (xr.ok) { var xd = await xr.json(); xSnippets = xd.snippets||[]; }
  } catch(e){}

  // Build round summary text from ESPN stats
  var parsed = parseCompStats(statsData);
  var aLast = a.name.split(' ').slice(-1)[0];
  var bLast = b.name.split(' ').slice(-1)[0];
  var rounds = Object.keys(parsed.perRound).map(Number).sort(function(x,y){return x-y;});
  var roundTxt = '';
  rounds.forEach(function(rn){
    var rd = parsed.perRound[rn]||{};
    function fk(last){ return Object.keys(rd).find(function(k){return k.toLowerCase().includes(last.toLowerCase());});}
    var as=rd[fk(aLast)]||{}, bs=rd[fk(bLast)]||{};
    roundTxt += 'Round '+rn+': '+aLast+' — '+(as.sig||'?')+(as.sigAtt?'/'+as.sigAtt:'')+' sig str, '+(as.td||0)+' TD, '+(as.kd||0)+' KD, ctrl '+(as.ctrl||'0:00')+'. ';
    roundTxt += bLast+' — '+(bs.sig||'?')+(bs.sigAtt?'/'+bs.sigAtt:'')+' sig str, '+(bs.td||0)+' TD, '+(bs.kd||0)+' KD, ctrl '+(bs.ctrl||'0:00')+'.\n';
  });
  if (!roundTxt) roundTxt = 'No round stats available from ESPN yet.';

  var xTxt = xSnippets.length
    ? 'X.com fan commentary:\n'+xSnippets.slice(0,5).map(function(s,i){return (i+1)+'. '+s;}).join('\n')
    : 'X.com commentary: not available.';

  var prompt = 'You are a UFC scorecard expert scoring live rounds using 10-9 MMA judging.\n\n'
    +'Fight: '+a.name+' vs '+b.name+'\n\n'
    +'ESPN Live Round Stats:\n'+roundTxt+'\n'
    +xTxt+'\n\n'
    +'Career stats context: '+a.name+'=slpm '+a.slpm+', sacc '+a.sacc+'%, style '+a.style+'. '+b.name+'=slpm '+b.slpm+', sacc '+b.sacc+'%, style '+b.style+'\n\n'
    +'For each completed round give: winner (10-9 or 10-8 if dominant) and one-sentence reason. '
    +'End with: current fight momentum and who you favor going forward. Under 180 words total. Be direct.';

  getApiKey(async function(apiKey){
    if (!apiKey) {
      if (btn) { btn.disabled=false; btn.textContent='🔮 Predict Round Winners · ESPN + X.com + AI'; }
      panel.innerHTML=''; return;
    }
    panel.innerHTML='<div class="ai-thinking" style="padding:8px 0">Generating prediction <span>…</span></div>';
    try {
      var res = await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:500,stream:true,messages:[{role:'user',content:prompt}]})
      });
      if (!res.ok) { var e=await res.json(); throw new Error((e.error&&e.error.message)||'HTTP '+res.status); }
      panel.innerHTML='<div style="margin-top:8px;padding:10px 12px;background:var(--bg4);border:1px solid rgba(139,92,246,.25);border-radius:8px">'
        +'<div style="font-size:9px;font-weight:700;letter-spacing:.1em;color:#a78bfa;margin-bottom:6px">🔮 ROUND PREDICTIONS · ESPN + X.com</div>'
        +'<div class="ai-content" id="roundAiTxt_'+fightIdx+'"></div></div>';
      var ct=document.getElementById('roundAiTxt_'+fightIdx);
      var reader=res.body.getReader(),dec=new TextDecoder(),buf='',full='';
      while(true){
        var rd=await reader.read(); if(rd.done)break;
        buf+=dec.decode(rd.value,{stream:true});
        var lines=buf.split('\n');buf=lines.pop();
        for(var li=0;li<lines.length;li++){
          var ln=lines[li];if(!ln.startsWith('data: '))continue;
          var dd=ln.slice(6).trim();if(dd==='[DONE]')continue;
          try{var ev=JSON.parse(dd);if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){full+=ev.delta.text;ct.innerHTML=full.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')+'<span style="opacity:.5">▋</span>';}}catch(ex){}
        }
      }
      ct.innerHTML=full.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
      if(btn){btn.disabled=false;btn.textContent='🔮 Regenerate Prediction';}
    } catch(err){
      var is401=err.message.includes('401')||err.message.toLowerCase().includes('auth');
      if(is401)sessionStorage.removeItem('ufc_ak');
      panel.innerHTML='<div style="color:var(--red);font-size:11px;padding:6px">'+err.message+(is401?' — key cleared, click again':'')+'</div>';
      if(btn){btn.disabled=false;btn.textContent='🔮 Predict Round Winners · ESPN + X.com + AI';}
    }
  });
}

function loadFight(idx, targetId){
  try {
    var i = parseInt(idx);
    var f = FIGHTS[i];
    if(!f){ console.error('loadFight: no fight at index', i); return; }

    var tid = targetId || 'fightDisplay';
    var container = document.getElementById(tid);
    if(!container){ console.error('loadFight: container not found', tid); return; }

        + '<span class="venue-item"><strong>Temp:</strong> ~' + VENUE.tempF + '°F · Indoor</span>'
        + '</div>';
    }

    var html = renderComp(f.a, f.b, f.wm, f.label, f.odds, i);
    container.innerHTML = html;
    bindListeners(i, f.a, f.b, f.wm, calcProb(f.a, f.b));

    if(!targetId || targetId === 'fightDisplay'){

// ── LIVE CARD: ESPN fetch with Mon/Fri auto-refresh ─
// Cache key stores event id + date so we re-fetch when the event changes
var _liveESPNData = null;       // in-memory cache for this session
var _liveRefreshTimer = null;  // auto-refresh interval when fights are live
var _roundStatsTimer = null;   // 30s polling for live round stats

function shouldFetchESPN(){
  // Fetch if: Mon or Fri, OR no cache, OR cache is from a different day
  var now = new Date();
  var day = now.getDay(); // 0=Sun,1=Mon,...,5=Fri,6=Sat
  var todayStr = now.toDateString();
  var cached = null;
  try{ cached = JSON.parse(localStorage.getItem('ufcLiveCache')||'null'); }catch(e){}
  // Always fetch if no cache
  if(!cached) return true;
  // Fetch if cache is stale (different calendar day)
  if(cached.date !== todayStr) return true;
  // Always re-fetch on Monday or Friday (fight week days)
  if(day === 1 || day === 5) return true;
  return false;
}

function setEventHeader(name, dateStr, isLive){
  var h = document.getElementById('liveEventHeader');
  if(!h) return;
  var badge = isLive
    ? '<span style="font-size:9px;padding:2px 7px;border-radius:4px;background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);margin-left:6px;font-weight:700;letter-spacing:.04em">LIVE</span>'
    : '<span style="font-size:9px;padding:2px 7px;border-radius:4px;background:var(--bg4);color:var(--text3);border:1px solid var(--border);margin-left:6px">SCHEDULED</span>';
  h.innerHTML = name + badge;
  if(dateStr){
    var sub = document.getElementById('liveEventSub');
    if(sub) sub.textContent = dateStr;
  }
}

function setRefreshBadge(text, color){
  var b = document.getElementById('liveRefreshBadge');
  if(b){ b.textContent = text; b.style.color = color||'var(--text3)'; }
}

async function fetchAndBuildLive(){
  setRefreshBadge('Fetching from ESPN…', 'var(--blue)');
  try{
    var r = await fetch('/api/espn?type=scoreboard&_='+Date.now());
    if(!r.ok) throw new Error('proxy '+r.status);
    var d = await r.json();
    if(d.error) throw new Error(d.error);

    _liveESPNData = d;
    // Cache it
    try{
      localStorage.setItem('ufcLiveCache', JSON.stringify({
        date: new Date().toDateString(),
        data: d
      }));
    }catch(e){}

    buildLiveListFromESPN(d);
    setRefreshBadge('ESPN · '+new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}), 'var(--green)');
  }catch(e){
    // Fallback to hardcoded FIGHTS
    if (_liveRefreshTimer) { clearInterval(_liveRefreshTimer); _liveRefreshTimer = null; }
    buildLiveListFromFIGHTS();
    setRefreshBadge('Static card · ESPN unavailable', 'var(--text3)');
  }
}

function buildLiveListFromESPN(d){
  if(!d||!d.events||!d.events.length){ buildLiveListFromFIGHTS(); return; }
  var event = d.events[0];
  var comps = event.competitions||[];
  if(!comps.length){ buildLiveListFromFIGHTS(); return; }

  var eventName = event.name||'UFC Event';
  var eventDate = event.date ? new Date(event.date).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}) : '';
  var anyLive = comps.some(function(c){ return c.status&&c.status.type&&c.status.type.state==='in'; });
  setEventHeader(eventName, eventDate, anyLive);

  var mainEl=document.getElementById('mainList');
  var preEl=document.getElementById('prelimList');
  if(!mainEl||!preEl) return;
  mainEl.innerHTML=''; preEl.innerHTML='';

  // Sort: later start times = main card
  var sorted = comps.slice().sort(function(a,b){
    return new Date(b.startDate||b.date) - new Date(a.startDate||a.date);
  });
  var total = sorted.length;
  var mainCount = Math.min(Math.ceil(total/2), 6);

  sorted.forEach(function(comp, ci){
    var cs = comp.competitors||[];
    var compA = cs.find(function(x){return x.order===1;})||cs[0];
    var compB = cs.find(function(x){return x.order===2;})||cs[1];
    if(!compA||!compB) return;

    var aName = (compA.athlete&&compA.athlete.displayName)||'Fighter A';
    var bName = (compB.athlete&&compB.athlete.displayName)||'Fighter B';
    var aLast = aName.split(' ').slice(-1)[0];
    var bLast = bName.split(' ').slice(-1)[0];
    var aRec = (compA.records&&compA.records[0]&&compA.records[0].summary)||'';
    var bRec = (compB.records&&compB.records[0]&&compB.records[0].summary)||'';
    var weight = (comp.type&&comp.type.abbreviation)||'';
    var status = comp.status&&comp.status.type;
    var state = status?status.state:'pre';
    var isLive = state==='in';
    var isDone = state==='post'||(status&&status.completed);
    var aWon = isDone&&compA.winner;
    var bWon = isDone&&compB.winner;
    var period = comp.status&&comp.status.period||0;
    var clock = comp.status&&comp.status.displayClock||'';
    var detail = (status&&(status.detail||status.shortDetail))||'Scheduled';

    // Try to match to our FIGHTS data for stats
    var fightIdx = FIGHTS.findIndex(function(f){ return f.espnId===comp.id; });
    // Fallback: robust name matching using nmatch (handles accents, compound names)
    if (fightIdx < 0) {
      fightIdx = FIGHTS.findIndex(function(f){
        return (nmatch(f.a.name, aName) && nmatch(f.b.name, bName))
            || (nmatch(f.a.name, bName) && nmatch(f.b.name, aName));
      });
    }
    var hasFightData = fightIdx >= 0;

    var liveTag = '';
    if(isLive) liveTag = '<span style="font-size:9px;padding:1px 6px;border-radius:3px;background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);margin-left:5px">RD '+period+' '+clock+'</span>';
    else if(isDone) liveTag = '<span style="font-size:9px;padding:1px 6px;border-radius:3px;background:var(--green-bg);color:var(--green);border:1px solid rgba(34,197,94,.2);margin-left:5px">Final'+(aWon?' · '+aLast+' W':bWon?' · '+bLast+' W':'')+'</span>';

    var div = document.createElement('div');
    div.className = 'fight-row';
    if(!hasFightData) div.style.opacity = '0.7';

    div.innerHTML = '<div>'
      +'<div class="fr-names">'
      +(aWon?'<strong>':'')+aLast+(aWon?'</strong>':'')+' <span>vs</span> '
      +(bWon?'<strong>':'')+bLast+(bWon?'</strong>':'')
      +liveTag+'</div>'
      +'<div class="fr-sub">'+weight+(aRec?' · '+aRec:'')+(hasFightData?' · tap for stats':'')+'</div>'
      +'</div>'
      +'<div class="fr-pick">'
      +(hasFightData
        ? (function(){
            var p=calcProb(FIGHTS[fightIdx].a,FIGHTS[fightIdx].b);
            var fn=p[0]>=p[1]?FIGHTS[fightIdx].a.name.split(' ').slice(-1)[0]:FIGHTS[fightIdx].b.name.split(' ').slice(-1)[0];
            return '<div class="fr-pct">'+fn+' '+Math.max(p[0],p[1])+'%</div><div class="fr-pct-label">model pick</div>';
          })()
        : '<div class="fr-pct-label" style="font-size:10px;color:var(--text3)">'+detail+'</div>')
      +'</div>';

    // Always attach click — even if fightIdx<0 (no FIGHTS match) show a status card
    (function(fi, espnEid, espnCid, aEspnId, bEspnId, fNameA, fNameB, fDetail){
      div.addEventListener('click', function(){
        document.querySelectorAll('.fight-row').forEach(function(r){r.style.borderColor='';r.style.background='';});
        div.style.borderColor='var(--blue)'; div.style.background='var(--bg4)';
        if(fi >= 0){
          loadFightWithLiveStats(fi, 'liveContent', aEspnId, bEspnId, espnEid, espnCid);
        } else {
          var lcc = document.getElementById('liveContent');
          if(lcc){
            lcc.innerHTML = '<div style="padding:1.5rem;text-align:center;color:var(--text3);font-size:13px">'
              +'<div style="font-size:18px;margin-bottom:8px">📋</div>'
              +'<div style="color:var(--text2);font-weight:600">'+fNameA+' vs '+fNameB+'</div>'
              +'<div style="font-size:11px;margin-top:4px">'+fDetail+'</div>'
              +'<div style="font-size:10px;margin-top:8px;color:var(--text4)">No detailed stats — fight not in local card data</div>'
              +'</div>';
            scrollToContent(lcc);
          }
        }
      });
    })(fightIdx, event.id, comp.id, (compA.athlete&&compA.athlete.id)||null, (compB.athlete&&compB.athlete.id)||null, aName, bName, detail);

    if(ci < mainCount) mainEl.appendChild(div);
    else preEl.appendChild(div);
  });

  // Auto-refresh every 60 s while any fight is live
  if (_liveRefreshTimer) { clearInterval(_liveRefreshTimer); _liveRefreshTimer = null; }
  if (anyLive) {
    _liveRefreshTimer = setInterval(function(){
      fetchAndBuildLive();
    }, 60000);
  }
}

function buildLiveListFromFIGHTS(){
  // Update header to show FN271
  setEventHeader('UFC Fight Night 272 · Moicano vs. Duncan', 'Sat, Apr 5, 2026 · Meta APEX · Las Vegas, NV', false);

  var mainEl=document.getElementById('mainList');
  var preEl=document.getElementById('prelimList');
  if(!mainEl||!preEl) return;
  mainEl.innerHTML=''; preEl.innerHTML='';

  function makeRow(f,i){
    var div=document.createElement('div');
    div.className='fight-row';
    var prob=calcProb(f.a,f.b);
    var favName=prob[0]>=prob[1]?f.a.name.split(' ').slice(-1)[0]:f.b.name.split(' ').slice(-1)[0];
    var favPct=Math.max(prob[0],prob[1]);
    var aLast=f.a.name.split(' ').slice(-1)[0];
    var bLast=f.b.name.split(' ').slice(-1)[0];
    var weightDiv=f.label.split('\u00b7')[0].trim();
    div.innerHTML='<div>'
      +'<div class="fr-names">'+aLast+' <span>vs</span> '+bLast+'</div>'
      +'<div class="fr-sub">'+weightDiv+' \u00b7 '+f.startET+'</div>'
      +'</div>'
      +'<div class="fr-pick">'
      +'<div class="fr-pct">'+favName+' '+favPct+'%</div>'
      +'<div class="fr-pct-label">model pick</div>'
      +'</div>';
    (function(fi, fight){
      div.addEventListener('click', function(){
        document.querySelectorAll('.fight-row').forEach(function(r){r.style.borderColor='';r.style.background='';});
        div.style.borderColor='var(--blue)'; div.style.background='var(--bg4)';
        try {
          var aId = fight.a.espnAthleteId || null;
          var bId = fight.b.espnAthleteId || null;
          var espnComp = null;
          try { espnComp = lookupEspnComp(fight.a.name, fight.b.name); } catch(e2) {}
          if (espnComp) {
            if (!aId) aId = espnComp.aAthleteId;
            if (!bId) bId = espnComp.bAthleteId;
          }
          loadFightWithLiveStats(fi, 'liveContent', aId, bId, espnComp ? espnComp.eid : null, espnComp ? espnComp.cid : null);
        } catch(e) {
          var lcc = document.getElementById('liveContent');
          if (lcc) lcc.innerHTML = '<div style="padding:1.5rem;text-align:center;color:var(--red);font-size:12px">Click error: ' + (e.message||e) + '</div>';
        }
      });
    })(i, f);
    return div;
  }

  FIGHTS.forEach(function(f,i){
    if(f.card==='MAIN') mainEl.appendChild(makeRow(f,i));
    else preEl.appendChild(makeRow(f,i));
  });
}

function buildLiveList(){
  // Check cache first — use it immediately so UI shows something right away
  var cached = null;
  try{ cached = JSON.parse(localStorage.getItem('ufcLiveCache')||'null'); }catch(e){}

  if(cached && cached.data){
    _liveESPNData = cached.data;
    buildLiveListFromESPN(cached.data);
    setRefreshBadge('ESPN (cached) \u00b7 '+cached.date, 'var(--text3)');
  } else {
    buildLiveListFromFIGHTS();
  }

  // Then fetch fresh data if needed (Mon/Fri or no cache)
  if(shouldFetchESPN()){
    fetchAndBuildLive();
  }
}

var rBlue=null,rRed=null;
function filterRoster(){
  var q=(document.getElementById('rosterSearch').value||'').toLowerCase();
  var div=document.getElementById('divFilter').value;
  var grid=document.getElementById('rosterGrid');
  var filtered=ROSTER.filter(function(f){return(!q||f.name.toLowerCase().includes(q))&&(!div||f.div===div);});
  grid.innerHTML='';
  if(!filtered.length){grid.innerHTML='<div style="font-size:13px;color:var(--text3);text-align:center;padding:2rem;font-style:italic">No fighters found</div>';return;}
  filtered.forEach(function(f){
    var iB=rBlue&&rBlue.name===f.name, iR=rRed&&rRed.name===f.name;
    var card=document.createElement('div');
    card.className='fighter-card'+(iB?' sel-blue':iR?' sel-red':'');
    card.innerHTML='<div class="fc-name">'+f.name+(f.champ?'<span class="fc-champ">C</span>':'')+'</div>'
      +'<div class="fc-rec">'+f.rec+(f.rank&&f.rank!=='NR'?' · '+f.rank:'')+'</div>'
      +'<div class="fc-div">'+f.div+'</div>';
    card.addEventListener('click',function(){toggleRoster(f);});
    grid.appendChild(card);
  });
}
function toggleRoster(f){
  if(rBlue&&rBlue.name===f.name)rBlue=null;
  else if(rRed&&rRed.name===f.name)rRed=null;
  else if(!rBlue)rBlue=f;
  else if(!rRed)rRed=f;
  else{rBlue=rRed;rRed=f;}
  updateRosterBar();filterRoster();
}
function updateRosterBar(){
  var bEl=document.getElementById('selBlueDisplay'),rEl=document.getElementById('selRedDisplay'),btn=document.getElementById('rosterCompareBtn');
  bEl.innerHTML=rBlue?'<span style="font-weight:500;color:var(--blue)">'+rBlue.name+'</span><br><span style="font-size:10px;color:var(--text3)">'+rBlue.rec+'</span>':'<span class="sel-empty">Tap a fighter</span>';
  rEl.innerHTML=rRed?'<span style="font-weight:500;color:var(--red)">'+rRed.name+'</span><br><span style="font-size:10px;color:var(--text3)">'+rRed.rec+'</span>':'<span class="sel-empty">Tap a fighter</span>';
  if(rBlue&&rRed){btn.disabled=false;btn.textContent='COMPARE: '+rBlue.name.split(' ').slice(-1)[0]+' vs '+rRed.name.split(' ').slice(-1)[0]+' →';}
  else{btn.disabled=true;btn.textContent='SELECT TWO FIGHTERS';}
}
function runRosterCompare(){
  if(!rBlue||!rRed)return;
  var a=rBlue,b=rRed;
  var prob=calcProb(a,b);
  var mW=prob[0]>=prob[1]?a:b;
  var ko=prob[0]>=prob[1]?a.ko:b.ko,sub=prob[0]>=prob[1]?a.sub:b.sub,dec=prob[0]>=prob[1]?a.dec:b.dec;
  var method='dec',pick=mW.name.split(' ').slice(-1)[0]+' Decision';
  if(ko+sub>dec){if(ko>=sub){method='ko';pick=mW.name.split(' ').slice(-1)[0]+' KO/TKO';}else{method='sub';pick=mW.name.split(' ').slice(-1)[0]+' Submission';}}
  var wm={pick:pick,method:method,reason:mW.name+' projected winner at '+Math.max(prob[0],prob[1])+'% probability.'};
  var res=document.getElementById('rosterResult');
  res.innerHTML=renderComp(a,b,wm,a.div+' · Roster Matchup',null,'c');
  bindListeners('c',a,b,wm,prob);
  res.scrollIntoView({behavior:'smooth',block:'start'});
}

  var ko=prob[0]>=prob[1]?a.ko:b.ko,sub=prob[0]>=prob[1]?a.sub:b.sub,dec=prob[0]>=prob[1]?a.dec:b.dec;
  var method='dec',pick=mW.name.split(' ')[0]+' Decision';
  if(ko+sub>dec){if(ko>=sub){method='ko';pick=mW.name.split(' ')[0]+' KO/TKO';}else{method='sub';pick=mW.name.split(' ')[0]+' Submission';}}
  var wm={pick:pick,method:method,reason:a.name.split(' ')[0]+' finish rate: '+Math.round((a.ko+a.sub)/(a.ko+a.sub+a.dec+1)*100)+'% · '+b.name.split(' ')[0]+' finish rate: '+Math.round((b.ko+b.sub)/(b.ko+b.sub+b.dec+1)*100)+'%.'};
  var res=document.getElementById('customResult');
  res.innerHTML=renderComp(a,b,wm,'Custom Matchup',null,'c');
  bindListeners('c',a,b,wm,prob);
}

function promptKey(){sessionStorage.removeItem('ufc_ak');showKeyModal(function(k){if(k){sessionStorage.setItem('ufc_ak',k);alert('Key saved.');}});}
function getApiKey(cb){var k=sessionStorage.getItem('ufc_ak');if(k){cb(k);return;}showKeyModal(function(k2){if(k2){sessionStorage.setItem('ufc_ak',k2);cb(k2);}else cb(null);});}
function showKeyModal(onSubmit){
  var m=document.createElement('div');m.id='keyModal';
  m.innerHTML='<div style="background:#18181c;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:1.5rem;max-width:420px;width:100%">'
    +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:18px;font-weight:700;margin-bottom:6px">Anthropic API Key</div>'
    +'<div style="font-size:12px;color:#a0a0a8;margin-bottom:16px">Get one free at <strong style="color:#3b82f6">console.anthropic.com</strong> → API Keys</div>'
    +'<input id="keyInput" type="password" placeholder="sk-ant-…" style="width:100%;padding:10px 12px;font-size:13px;background:#0a0a0b;color:#f0f0f0;border:1px solid rgba(255,255,255,.2);border-radius:8px;font-family:monospace;margin-bottom:12px;outline:none"/>'
    +'<div id="keyErr" style="font-size:11px;color:#ef4444;margin-bottom:10px;display:none"></div>'
    +'<div style="display:flex;gap:8px">'
    +'<button id="keyCancelBtn" style="flex:1;padding:9px;font-size:13px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#a0a0a8;border-radius:8px;cursor:pointer;font-family:\'Barlow\',sans-serif">Cancel</button>'
    +'<button id="keyOkBtn" style="flex:2;padding:9px;font-size:13px;font-weight:600;border:none;background:#3b82f6;color:#fff;border-radius:8px;cursor:pointer;font-family:\'Barlow\',sans-serif">Start Analysis</button>'
    +'</div></div>';
  document.body.appendChild(m);
  var inp=document.getElementById('keyInput');
  setTimeout(function(){inp.focus();},50);
  document.getElementById('keyCancelBtn').addEventListener('click',function(){m.remove();onSubmit(null);});
  m.addEventListener('click',function(e){if(e.target===m){m.remove();onSubmit(null);}});
  document.getElementById('keyOkBtn').addEventListener('click',function(){
    var v=inp.value.trim();
    if(!v||!v.startsWith('sk-ant-')){document.getElementById('keyErr').textContent='Key must start with sk-ant-';document.getElementById('keyErr').style.display='block';return;}
    m.remove();onSubmit(v);
  });
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('keyOkBtn').click();});
}

async function runDeepAnalysis(btn,a,b,prob,wm){
  var fIdx=btn.id.replace('deepBtn_','');
  var panelId='aiPanel_'+fIdx;
  var panel=document.getElementById(panelId); if(!panel)return;
  var prompt='You are an expert MMA analyst. Deep breakdown for: '+a.name+' ('+a.rec+', '+a.style+', str acc '+a.sacc+'%, str def '+a.sdef+'%, KO '+a.ko+', Sub '+a.sub+') vs '+b.name+' ('+b.rec+', '+b.style+', str acc '+b.sacc+'%, str def '+b.sdef+'%, KO '+b.ko+', Sub '+b.sub+'). Win probability: '+a.name.split(' ')[0]+' '+prob[0]+'% — '+b.name.split(' ')[0]+' '+prob[1]+'%. Predicted: '+wm.pick+'. Venue: Seattle Climate Pledge Arena, 175ft altitude (sea level), indoor, standard 30ft octagon.\n\nCover: 1) 3 key X-factors 2) Each fighter path to victory 3) Round-by-round prediction 4) Final verdict. Sharp, stat-backed, under 400 words.';
  getApiKey(async function(apiKey){
    if(!apiKey)return;
    btn.disabled=true;btn.textContent='⚡ Analyzing…';
    panel.innerHTML='<div class="ai-thinking">Generating breakdown <span style="margin-left:4px">…</span></div>';
    try{
      var res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,stream:true,messages:[{role:'user',content:prompt}]})});
      if(!res.ok){var e=await res.json();throw new Error((e.error&&e.error.message)||'HTTP '+res.status);}
      panel.innerHTML='<div class="ai-content" id="aiTxt_'+fIdx+'"></div>';
      var ct=document.getElementById('aiTxt_'+fIdx);
      var reader=res.body.getReader(),dec=new TextDecoder(),buf='',full='';
      while(true){
        var rd=await reader.read(); if(rd.done)break;
        buf+=dec.decode(rd.value,{stream:true});
        var lines=buf.split('\n');buf=lines.pop();
        for(var i=0;i<lines.length;i++){
          var ln=lines[i]; if(!ln.startsWith('data: '))continue;
          var data=ln.slice(6).trim(); if(data==='[DONE]')continue;
          try{var ev=JSON.parse(data);if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){full+=ev.delta.text;ct.innerHTML=full.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')+'<span style="opacity:.5">▋</span>';}}catch(ex){}
        }
      }
      ct.innerHTML=full.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
      btn.innerHTML='⚡ Regenerate';btn.disabled=false;
    }catch(err){
      var is401=err.message.includes('401')||err.message.toLowerCase().includes('auth');
      if(is401)sessionStorage.removeItem('ufc_ak');
      panel.innerHTML='<div style="color:var(--red);font-size:12px;padding:8px">'+err.message+(is401?' — key cleared, click again to re-enter':'')+'</div>';
      btn.innerHTML='⚡ Deep AI Analysis';btn.disabled=false;
    }
  });
}
